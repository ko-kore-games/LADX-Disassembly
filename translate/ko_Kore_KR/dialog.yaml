"Dialog001": "앗！精神이들었구나！多幸이다。\n이젠　못일어나나싶었어‥‥‥\n무서운꿈을　꾸는것같았어‥\n가위도　甚하게　눌리고있었고。\n‥‥‥응？　젤다？？\n\
  아니야。　나는　마린。\n意識이　明確하지않나보네\n여긴　코호린트섬이야。\n@"
"Dialog003": "앗！＃＃＃＃＃　타린은　숲으로\n버섯을　따러　나갔어。\n나는　노래부르는게　正말좋아！\n들어줘！「바람물고기」의노래야\n@"
"Dialog002": "길을따라　南쪽으로　걸으면\n네가　떠내려온　海邊이야。\n다만、네가섬에와서부터　怪物들이\n이近傍에도　徘徊하게되었어。\n操心해서가줘。@"
"Dialog004": "어어？　근사한　피리를　찾았구나\n내　노래에　맞춰　불어봐\n@"
"Dialog008": "힘의조각을　發見했다！\n뭔가　힘이솟아오른다！@"
"Dialog014": "이노래、안잊어버리도록\n가끔가다　불러봐줘！@"
"Dialog016": "어때？　마음에물드는것같지？\n제대로　記億했어？\n　　　　응　　　　全혀%"
"Dialog023": "컹　컹　컹　컹　컹\n@"
"Dialog024": "傷處와疲勞를　治癒해드릴게요。\n暫時동안만、눈을감아봐요．．@"
"Dialog005": "亦是나는　노래가 좋아！\n＃＃＃＃＃　너는　뭘　좋아해？@"
"Dialog006": "＃＃＃＃＃ 타린은　집에서\n낮잠자고 있어。\n나는　노래를할거야！\n맞아「바람물고기」의　노래야。\n@"
"Dialog007": "읏！열쇠로 잠겨있다！\n보스열쇠로　열수있을것같다。\n@"
"Dialog013": "「바람물고기」의노래를\n마린에게　배웠다！\n마린의　노랫소리가\n便安하게　귓가에남는다。\n@"
"Dialog015": "에－！　제대로記億해줘！\n내가좋아하는　노래니깐@"
"Dialog01F": "야호！　마린을　빌렸다！\n　　　　이　이건　찬스！？@"
"Dialog095": "페가수스신발을　손에넣었다！\n버튼을길게누르면　달릴수있다\n@"
"Dialog096": "오카리나를　손에넣었다！\n여러가지曲을　불어보고싶다\n@"
"Dialog09B": "잃어버렸던劍을　손에넣었다！\n이름이써있으니　틀림없다！\n@"
"Dialog0A1": "테일열쇠를　손에넣었다！\n이걸로　테일의門을열수있다！\n@"
"Dialog0A3": "앵귤러열쇠를　손에넣었다！\n@"
"Dialog0A4": 페이스열쇠를　손에넣었다！@
"Dialog0A5": "버드열쇠를　손에넣었다！\n팀워크의　勝利다！\n@"
"Dialog0EE": "파워풀브레이슬릿을　손에넣었다\n이젠　石像도　들어올릴수있다！\n@"
"Dialog0EF": "秘密의조개껍질을　손에넣었다！\n많이모으면　좋은걸받을수있다\n@"
"Dialog03D": "防牌를손에넣었다！\n뒷面에　이름을써놓자！@"
"Dialog04F": "하트조각을손에넣었다！\n　　　　　　　　　　　　　　　　\n서브畵面에서　셀렉트버튼을\n누르면　確認할수있다！@"
"Dialog093": "훅샷을손에넣었다！\n쭈－욱　늘려서使用하자！\n@"
"Dialog094": "매직로드를　손에넣었다！\n태워！태워！다태워버리자！！@"
"Dialog097": "록鳥의날개를　손에넣었다！\n둥실、몸이가벼워진다。@"
"Dialog098": "삽을　손에넣었다！　파자！\n땅을파는　즐거움을맛보자。\n@"
"Dialog099": "麻法의가루를　손에넣었다！\n이곳저곳에　뿌려보자\n@"
"Dialog09A": "爆彈을　손에넣었다！\n쾅－하고터뜨리자、쾅－！@"
"Dialog09F": "새劍을　손에넣었다아！\n얼른　이름을써놓자！\n@"
"Dialog0A2": "슬라임열쇠를　손에넣었다！\n우쿠쿠草原입구로가자\n@"
"Dialog0A7": "羅針盤을　손에넣었다！\n보스와寶物이있는場所를알수있다！\n게다가！　열쇠가있는房을\n소리로알려주는　新機能搭載！\n@"
"Dialog0A9": "보스열쇠를　손에넣었다！\n보스房門을　열수있다\n@"
"Dialog0AA": "작은열쇠를　손에넣었다！\n잠겨있는門을　열수있다\n@"
"Dialog0AB": "２０루피를　손에넣었다！\n조금기쁘다。@"
"Dialog0AC": "５０루피를　손에넣었다！\n꽤　기쁘다。@"
"Dialog0AD": "１００루피를　손에넣었다！\n相當히기쁘다。@"
"Dialog0AE": "２００루피를　손에넣었다！\n몹시　기쁘다！@"
"Dialog0EC": "守護의열매를　손에넣었다！\n敵에게서받는대미지가半減된다\n@"
"Dialog0ED": "거울防牌를　손에넣었다！\n막을수없었던빔도　反射해주자\n@"
"Dialog102": "「바다나리의鐘」을손에넣었다！\n@"
"Dialog224": "갖고있던아이템과　바꿔\n부메랑을　손에넣었다！\n@"
"Dialog25A": "파란色옷을　손에넣었다！\n하트가　덜줄어들게되었다。\n@"
"Dialog25B": "빨간色옷을　손에넣었다！\n온몸에　힘이넘쳐난다\n@"
