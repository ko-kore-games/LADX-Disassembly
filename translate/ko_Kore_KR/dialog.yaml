"Dialog001": "앗！精神이들었구나！多幸이다。\n이젠　못일어나나싶었어‥‥‥\n무서운꿈을　꾸는것같았어‥\n가위도　甚하게　눌리고있었고。\n‥‥‥응？　젤다？？\n\
  아니야。　나는　마린。\n意識이　明確하지않나보네\n여긴　코호린트섬이야。\n@"
"Dialog003": "앗！＃＃＃＃＃　타린은　숲으로\n버섯을　따러　나갔어。\n나는　노래부르는게　正말좋아！\n들어줘！「바람물고기」의노래야\n@"
"Dialog002": "길을따라　南쪽으로　걸으면\n네가　떠내려온　海邊이야。\n다만、네가섬에와서부터　怪物들이\n이近傍에도　徘徊하게되었어。\n操心해서가줘。@"
"Dialog004": "어어？　근사한　피리를　찾았구나\n내　노래에　맞춰　불어봐\n@"
"Dialog008": "힘의조각을　發見했다！\n뭔가　힘이솟아오른다！@"
"Dialog014": "이노래、안잊어버리도록\n가끔가다　불러봐줘！@"
"Dialog016": "어때？　마음에물드는것같지？\n제대로　記億했어？\n　　　　응　　　　全혀%"
"Dialog023": "컹　컹　컹　컹　컹\n@"
"Dialog024": "傷處와疲勞를　治癒해드릴게요。\n暫時동안만、눈을감아봐요．．@"
"Dialog005": "亦是나는　노래가 좋아！\n＃＃＃＃＃　너는　뭘　좋아해？@"
"Dialog006": "＃＃＃＃＃ 타린은　집에서\n낮잠자고 있어。\n나는　노래를할거야！\n맞아「바람물고기」의　노래야。\n@"
"Dialog007": "읏！열쇠로 잠겨있다！\n보스열쇠로　열수있을것같다。\n@"
"Dialog013": "「바람물고기」의노래를\n마린에게　배웠다！\n마린의　노랫소리가\n便安하게　귓가에남는다。\n@"
"Dialog015": "에－！　제대로記億해줘！\n내가좋아하는　노래니깐@"
"Dialog01F": "야호！　마린을　빌렸다！\n　　　　이　이건　찬스！？@"
